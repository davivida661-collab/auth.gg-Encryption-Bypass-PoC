# GitHub Actions CI/CD Workflow
# Auth.GG Encryption Bypass PoC - Build and Validate

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'freebuff/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: PHP Validation
  php-lint:
    name: PHP Lint & Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: openssl, mbstring
          tools: phpcs

      - name: Validate PHP syntax (cpp/index.php)
        run: php -l cpp/index.php

      - name: Validate PHP syntax (csharp/server/index.php)
        run: php -l csharp/server/index.php

      - name: Run PHP CodeSniffer
        run: |
          phpcs --standard=PSR12 cpp/index.php || true
          phpcs --standard=PSR12 csharp/server/index.php || true

  # Job 2: .NET Framework Build (Windows with MSBuild)
  dotnet-build:
    name: .NET Framework Build
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore csharp/client/harmony-ssl-hook.sln

      - name: Build Solution (Debug)
        run: '& "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" "csharp/client/harmony-ssl-hook.sln" /p:Configuration=Debug /p:Platform="Any CPU" /p:VisualStudioVersion=17.0'

      - name: Build Solution (Release)
        run: '& "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" "csharp/client/harmony-ssl-hook.sln" /p:Configuration=Release /p:Platform="Any CPU" /p:VisualStudioVersion=17.0'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmony-ssl-hook-build
          path: csharp/client/bin/Release/
          retention-days: 30

  # Job 3: Documentation Validation
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "Error: README.md not found"
            exit 1
          fi

      - name: Check LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "Error: LICENSE not found"
            exit 1
          fi

      - name: Verify file structure
        run: |
          echo "Project structure:"
          find . -type f -not -path './.git/*' | sort
          
          # Verify critical files exist
          for file in \
            "cpp/index.php" \
            "csharp/server/index.php" \
            "csharp/client/harmony-ssl-hook/Program.cs" \
            "csharp/client/harmony-ssl-hook.sln" \
            "README.md" \
            "LICENSE"; do
            if [ ! -f "$file" ]; then
              echo "Warning: $file not found"
            fi
          done

  # Job 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded secrets..."
          
          # Check for common secret patterns (exclude test/example values)
          if grep -r "password\s*=" --include="*.php" --include="*.cs" . | grep -v "password\s*=\s*''" | grep -v "// " | grep -v "# " | grep -v "example"; then
            echo "⚠️  Warning: Potential hardcoded passwords found"
          fi
          
          if grep -r "api_key\s*=" --include="*.php" --include="*.cs" . | grep -v "api_key\s*=\s*''" | grep -v "// " | grep -v "# " | grep -v "example"; then
            echo "⚠️  Warning: Potential hardcoded API keys found"
          fi
          
          echo "Security scan completed"

      - name: Verify no sensitive files committed
        run: |
          # Check for common sensitive files
          for file in ".env" ".env.local" "*.pem" "*.key" "*.p12"; do
            if find . -name "$file" -not -path "./.git/*" | grep -q .; then
              echo "⚠️  Warning: Found potentially sensitive file: $file"
            fi
          done
          
          echo "Sensitive file check completed"

  # Job 5: Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [php-lint, dotnet-build, docs, security]
    
    steps:
      - name: Display build summary
        run: |
          echo "=========================================="
          echo "  CI/CD Pipeline Summary"
          echo "=========================================="
          echo ""
          echo "✅ PHP Lint: ${{ needs.php-lint.result }}"
          echo "✅ .NET Build: ${{ needs.dotnet-build.result }}"
          echo "✅ Documentation: ${{ needs.docs.result }}"
          echo "✅ Security: ${{ needs.security.result }}"
          echo ""
          echo "=========================================="
          
          if [ "${{ needs.php-lint.result }}" = "failure" ] || \
             [ "${{ needs.dotnet-build.result }}" = "failure" ] || \
             [ "${{ needs.docs.result }}" = "failure" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          
          echo "✅ All jobs completed successfully"
